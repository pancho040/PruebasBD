name: CI PRUEBAS automatizadas (develop)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test_application:
    name: "Ejecutar pruebas automatizadas"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Set environment variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
          echo "PORT=3000" >> $GITHUB_ENV

      - name: Run tests
        run: |
          echo "Iniciando pruebas automatizadas..."
          npx jest --verbose --runInBand

      - name: Notify test results
        run: |
          if [ $? -ne 0 ]; then
            echo "Pruebas automatizadas fallidas ❌"
          else
            echo "Pruebas automatizadas exitosas ✅"
          fi
