name: CI PRUEBAS automatizadas (develop)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test_application:
    name: "Ejecutar pruebas automatizadas"
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Configurar variables de entorno
      - name: Set environment variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
          echo "PORT=3000" >> $GITHUB_ENV

      # 5️⃣ Ejecutar pruebas
      - name: Run tests
        run: |
          echo "Iniciando pruebas automatizadas..."
          npm run test
        continue-on-error: true

      # 6️⃣ Notificar resultados
      - name: Notify test results
        run: |
          if [ $? -ne 0 ]; then
            echo "Pruebas automatizadas fallidas ❌"
          else
            echo "Pruebas automatizadas exitosas ✅"
          fi
